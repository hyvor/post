name: Sync docs to core

# Tells hyvor/core to sync docs/ when it changes on main.
# See meta/docs/README.md in hyvor/core.

on:
    push:
        branches: [main]
        paths: [docs/**]
    workflow_dispatch:

jobs:
    dispatch:
        runs-on: ubuntu-latest
        steps:
            -   run: |
                    curl -fsS -X POST \
                      -H "Authorization: Bearer ${{ secrets.HYVOR_ORG_CORE_DISPATCH_TOKEN }}" \
                      -H "Accept: application/vnd.github+json" \
                      https://api.github.com/repos/hyvor/core/dispatches \
                      -d '{"event_type":"docs-updated","client_payload":{"product":"post"}}'

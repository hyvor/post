name: Translate Content

on:
  push:
    branches: [main]
    paths:
      - 'docs/*/en/**'
      - 'docs/*/locale/en.json'
  workflow_dispatch:
    inputs:
      langs:
        description: "Comma-separated language codes to translate (default: all configured languages)"
        required: false
        type: string
      force_all:
        description: "Force re-translate all files, ignoring the cache"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    name: "Translate Content"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install translator
        run: npm install -g @hyvor/translator

      - name: Run translation
        id: translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HYVOR_ORG_ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: |
          ARGS=(--config meta/translator/translator.config.json)
          if [ -n "${{ inputs.langs }}" ]; then
            ARGS+=(--langs "${{ inputs.langs }}")
          fi
          if [ "${{ inputs.force_all }}" = "true" ]; then
            ARGS+=(--force-all)
          fi
          hyvor-translator "${ARGS[@]}"

      - name: Open PR with translated content
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update translations"
          title: "Update translations"
          body: |
            Auto-generated by the Translate Content workflow.
            Source change: ${{ github.sha }}
          branch: auto/translate

      - name: Fail if any file failed to translate
        if: steps.translate.outcome == 'failure'
        run: exit 1
